name: Deploy website to Simply

on:
  push:
    branches: [master]
    paths:
      - "dist/**"
      - ".github/workflows/simply-ftp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simply-ftp
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload dist to Simply
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload website with FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: /public_html/
